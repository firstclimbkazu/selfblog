name: ✨ 機能要望
description: 新機能・改善案を提案する
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        機能提案ありがとうございます。背景と受け入れ基準を明確にすると実装がスムーズになります。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何を実現したいか一言で
      placeholder: 記事にタグ複数選択フィルターを追加したい
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 背景・動機
      description: なぜこの機能が必要か、どんな課題を解決するか
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案内容
      description: どんな実装・UIを想定しているか（スケッチや参考URLがあれば）
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ基準
      description: 「これができたら完了」の条件をチェックリスト形式で
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: tech
    attributes:
      label: 技術的な考慮事項
      description: 実装上の注意点・影響範囲・依存関係など（任意）

  - type: dropdown
    id: scope
    attributes:
      label: 影響範囲
      options:
        - フロントエンド（UI / コンポーネント）
        - バックエンド（API / DB / Prisma）
        - インフラ（Vercel / Supabase）
        - エージェント / 開発ワークフロー
        - その他
    validations:
      required: true
