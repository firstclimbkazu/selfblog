services:
  db:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sotw_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sotw_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  webapp:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./webapp:/app
      - webapp_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sotw_dev
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy

  studio:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  webapp-prod:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --include=dev && npm run build && npm start"
    profiles: ["test"]
    ports:
      - "3000:3000"
    volumes:
      - ./webapp:/app
      - webapp_prod_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sotw_dev
      NODE_ENV: production
      NEXT_DIST_DIR: .next-prod
      AUTH_URL: "http://localhost:3000"
      AUTH_TRUST_HOST: "true"
    env_file:
      - ./webapp/.env.local
    depends_on:
      db:
        condition: service_healthy

  db-test:
    image: postgres:15
    profiles: ["e2e"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sotw_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sotw_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  webapp-e2e:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed-e2e.ts && npm run dev"
    profiles: ["e2e"]
    ports:
      - "3001:3000"
    volumes:
      - ./webapp:/app
      - webapp_e2e_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db-test:5432/sotw_test
      NODE_ENV: development
      NEXT_DIST_DIR: .next-e2e
      AUTH_URL: "http://localhost:3001"
      AUTH_TRUST_HOST: "true"
      WATCHPACK_POLLING: "true"
    env_file:
      - ./webapp/.env.local
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  webapp_node_modules:
  webapp_prod_node_modules:
  webapp_e2e_node_modules:
